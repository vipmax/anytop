name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build for Linux musl
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build Linux x86_64 musl binary
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Package as tar.gz
        run: |
          mkdir -p dist
          strip target/x86_64-unknown-linux-musl/release/anytop
          cp target/x86_64-unknown-linux-musl/release/anytop dist/
          tar -czf anytop-linux.tar.gz -C dist anytop

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: anytop-linux.tar.gz

  build-macos:
    name: Build for macOS Universal
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build macOS binaries
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: Create universal binary
        run: |
          mkdir -p dist
          lipo -create \
            target/aarch64-apple-darwin/release/anytop \
            target/x86_64-apple-darwin/release/anytop \
            -output dist/anytop

      - name: Package as tar.gz
        run: |
          strip dist/anytop
          tar -czf anytop-universal-apple-darwin.tar.gz -C dist anytop

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: anytop-universal-apple-darwin.tar.gz
